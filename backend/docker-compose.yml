services:
  postgres:
    image: postgres:16-alpine
    container_name: optivest-postgres
    environment:
      POSTGRES_DB: optivest
      POSTGRES_USER: optivest
      POSTGRES_PASSWORD: optivest
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optivest -d optivest"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - optivest_postgres_data:/var/lib/postgresql/data

volumes:
  optivest_postgres_data:
